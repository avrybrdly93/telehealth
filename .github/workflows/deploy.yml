name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Auto-merge claude branches']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# BUG-008. GitHub Pages accepts one deployment at a time; a second is rejected
# outright with "Deployment request failed … due to in progress deployment".
# This workflow has three trigger paths (push, workflow_dispatch, and the
# workflow_run chain off Auto-merge claude branches), so two landings close
# together produce two overlapping runs — run 113 (49f1d9c) died this way 46
# seconds behind run 112 (a5f1631), after a green build, and its build was
# discarded. The group is repository-wide, not per-ref or per-run: the two runs
# that collided were both on main, so anything keyed on the ref would not have
# serialised them. cancel-in-progress stays false so a deployment already
# uploading is never aborted part-way; a queued run supersedes an earlier queued
# run, which is the right outcome — the newest commit is the one to serve.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # BL-033 / DEPLOYMENT_AND_OPERATIONS_PLAN.md §Pipeline post-deploy smoke check. Only checks that
  # exist on production today are implemented; anything not yet built stays commented out below
  # rather than faked. "/book Step 1 renders" was deferred in session 26 because /book did not
  # exist; BL-021 (session 31) shipped Steps 1-4, so it is implemented as of session 32. The
  # "contact function healthcheck" remains deferred — no /api/contact function exists (BL-022,
  # blocked on D-009) — see D-012.
  #
  # BL-045. A RED RUN HERE DOES NOT MEAN THE SITE IS BROKEN.
  #
  # `deploy` green + `smoke` red means the site is LIVE BUT UNVERIFIED:
  # `actions/deploy-pages@v4` already returned success, so the commit is being
  # served. Only the post-deploy verification is missing. The correct first
  # response is to RE-RUN THE FAILED JOB, not to open `astro.config.mjs` or
  # `pnpm-lock.yaml`.
  #
  # How to tell which kind of red you have, before diagnosing anything: read
  # the job record. A job that ran and failed has a `steps` array, a
  # `runner_id`, and a log. A job that never got a runner has none of the three
  # and its log endpoint returns HTTP 404 rather than an empty log. Run 184
  # (`6a40066`) was the second kind — 15m15s, zero steps, no runner — and
  # re-running it alone passed all three checks in 2s against the same live
  # site.
  #
  # `timeout-minutes` bounds that, and 5 is far above anything the work needs:
  # the three checks together took 2s on run 184's attempt 2, and each `curl`
  # already bounds its own wait with `--retry 5 --retry-delay 5`, so the
  # in-job worst case is well under two minutes. The timeout is therefore
  # aimed at the *waiting*, not at the checks.
  #
  # Whether it fires while a job is queued is evidence, not doctrine: run 184's
  # starved `smoke` job carried `started_at` == `created_at` == 22:14:36 and
  # `completed_at` 22:29:51, so by the API's own accounting it was running for
  # 15m15s. That is the clock `timeout-minutes` bounds, which is why 5 should
  # turn a future starvation into a single-digit-minute failure. It has not
  # been reproduced — runner starvation cannot be manufactured on demand — so
  # if a future starved run still takes fifteen minutes, this comment is the
  # thing that was wrong, not the workflow.
  #
  # NOT `continue-on-error`. That would satisfy the badge and destroy the
  # check: a genuine homepage 404 would then deploy silently, which is the one
  # failure this job exists to catch.
  #
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Homepage returns 200
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${{ needs.deploy.outputs.page_url }}")
          echo "homepage status: $status"
          test "$status" = "200"

      - name: sitemap.xml is reachable and non-empty
        run: |
          url="${{ needs.deploy.outputs.page_url }}sitemap.xml"
          status=$(curl -s -o /tmp/sitemap.xml -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
          echo "sitemap status: $status"
          test "$status" = "200"
          test -s /tmp/sitemap.xml

      # /book Step 1 renders (BL-021, session 31). Asserts the Step 1 heading's stable id rather
      # than its copy, so a COPY_GUIDELINES.md wording change doesn't red the deploy pipeline.
      - name: /book Step 1 renders
        run: |
          url="${{ needs.deploy.outputs.page_url }}book/"
          status=$(curl -s -o /tmp/book.html -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
          echo "book status: $status"
          test "$status" = "200"
          test -s /tmp/book.html
          grep -q 'id="booking-step-1-heading"' /tmp/book.html

      # TODO (blocked): "contact function healthcheck" — no /api/contact function exists yet
      # (BL-022, blocked on D-009/D-012, Tier 3 Proposed).
