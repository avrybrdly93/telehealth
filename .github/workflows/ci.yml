name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Auto-merge claude branches']
    types: [completed]

jobs:
  lint-typecheck-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Format check
        run: pnpm run format

      - name: Readability check (UX-002)
        # Blocking since BL-018 (2026-08-03): BL-032 drafted conditions/*.md content that passes
        # grade <=8 alongside COPY_GUIDELINES.md Hard Rule 2's mandatory disclaimer sentence, so
        # the continue-on-error warn phase D-008 documented is no longer needed. See
        # DECISION_LOG.md D-008 for the original non-blocking rationale and BACKLOG.md BL-018.
        run: pnpm run check:readability

      - name: Build
        run: pnpm run build

  e2e-axe-lighthouse:
    needs: lint-typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: E2E + axe (Playwright, mobile + desktop)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse CI
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm exec lhci autorun --config=lighthouserc.cjs
