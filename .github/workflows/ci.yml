name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ['Auto-merge claude branches']
    types: [completed]

jobs:
  lint-typecheck-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Format check
        run: pnpm run format

      - name: Readability check (UX-002)
        # Non-blocking: 3 conditions/*.md files fail solely because of the mandatory verbatim
        # disclaimer sentence required by COPY_GUIDELINES.md Hard Rule 2, which cannot be edited
        # for readability. See DECISION_LOG.md D-008 and BACKLOG.md BL-018 (flip to blocking once
        # resolved) — same "warns->blocks" rollout TESTING_AND_VALIDATION_PLAN.md documents.
        run: pnpm run check:readability
        continue-on-error: true

      - name: Build
        run: pnpm run build

  e2e-axe-lighthouse:
    needs: lint-typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: E2E + axe (Playwright, mobile + desktop)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse CI
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm exec lhci autorun --config=lighthouserc.cjs
